{{- if .Values.auth.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-auth" (include "kuchdesk-agent.fullname" .) }}
  labels:
    {{- include "kuchdesk-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.tokenKey }}: {{ .Values.auth.token | quote }}
{{- end }}
