{{- if not .Values.image.repository }}
{{- fail "image.repository is required." }}
{{- end }}
{{- if hasKey .Values "configFiles" }}
{{- fail "configFiles is no longer supported; Helm supplies Pod ENV and Secrets from canonical YAML." }}
{{- end }}
{{- if hasKey .Values.agent "listenAddress" }}
{{- fail "agent.listenAddress is no longer supported; set agent.listenHost and service.targetPort instead." }}
{{- end }}
{{- if or (hasKey .Values.dnsManagement "overrideKey") (hasKey .Values.dnsManagement "createConfigMap") }}
{{- fail "dnsManagement.overrideKey and createConfigMap are no longer supported; configure the existing CoreDNS ConfigMap with dnsManagement.corefileKey." }}
{{- end }}
{{- if or (lt (int .Values.service.targetPort) 1) (gt (int .Values.service.targetPort) 65535) }}
{{- fail "service.targetPort must be a TCP port between 1 and 65535." }}
{{- end }}
{{- if not .Values.image.tag }}
{{- fail "image.tag is required and must be an immutable deployment tag." }}
{{- end }}
{{- if eq .Values.image.tag "latest" }}
{{- fail "image.tag must not be latest." }}
{{- end }}
{{- if not (regexMatch "^git-[0-9a-f]{12}(-dirty-[0-9a-f]{12})?$" .Values.image.tag) }}
{{- fail "project-built image.tag must identify the verified source as git-<12-hex> or git-<12-hex>-dirty-<12-hex-input-hash>" }}
{{- end }}
{{- if and .Values.image.digest (not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.image.digest)) }}
{{- fail "image.digest must be a sha256 digest." }}
{{- end }}
{{- if not (or .Values.auth.existingSecret .Values.auth.token) }}
{{- fail "agent auth is required; configure auth.existingSecret or auth.token." }}
{{- end }}
{{- if and .Values.rbac.clusterAdmin (not .Values.rbac.create) }}
{{- fail "rbac.create is required when rbac.clusterAdmin=true." }}
{{- end }}
{{- if and .Values.rbac.clusterAdmin (not .Values.serviceAccount.create) }}
{{- fail "serviceAccount.create is required when rbac.clusterAdmin=true to use a dedicated identity." }}
{{- end }}
{{- if and .Values.agent.managementEnabled (not .Values.rbac.clusterAdmin) }}
{{- fail "rbac.clusterAdmin is required when agent.managementEnabled=true." }}
{{- end }}
{{- if and .Values.agent.execEnabled (not .Values.agent.managementEnabled) }}
{{- fail "agent.managementEnabled is required when agent.execEnabled=true." }}
{{- end }}
{{- if and .Values.agent.portForwardEnabled (not .Values.agent.managementEnabled) }}
{{- fail "agent.managementEnabled is required when agent.portForwardEnabled=true." }}
{{- end }}
{{- if and .Values.auth.existingSecret .Values.auth.token }}
{{- fail "choose auth.existingSecret or auth.token, not both." }}
{{- end }}
{{- if or (hasKey .Values.hostBridge "clientId") (hasKey .Values.hostBridge "clientSecret") }}
{{- fail "hostBridge clientId and clientSecret are unsupported." }}
{{- end }}
{{- if and .Values.hostBridge.token .Values.hostBridge.tokenSecretName }}
{{- fail "choose hostBridge.token or hostBridge.tokenSecretName, not both." }}
{{- end }}
{{- if and .Values.hostBridge.caPEM .Values.hostBridge.caConfigMapName }}
{{- fail "choose hostBridge.caPEM or hostBridge.caConfigMapName, not both." }}
{{- end }}
{{- if and .Values.hostBridge.token (lt (len .Values.hostBridge.token) 32) }}
{{- fail "hostBridge.token must contain at least 32 characters." }}
{{- end }}
{{- if and .Values.hostBridge.enabled (or (not (or .Values.auth.existingSecret .Values.auth.token)) (not (or .Values.hostBridge.tokenSecretName .Values.hostBridge.token)) (not (regexMatch "^https://[^/?#@]+/?$" .Values.hostBridge.url))) }}
{{- fail "hostBridge requires agent auth, an HTTPS origin, and a dedicated bridge token or existing Secret." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kuchdesk-agent.fullname" . }}
  labels:
    {{- include "kuchdesk-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kuchdesk-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kuchdesk-agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.podAnnotations (and .Values.hostBridge.enabled (or .Values.hostBridge.caConfigMapName .Values.hostBridge.caPEM)) }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and .Values.hostBridge.enabled (or .Values.hostBridge.caConfigMapName .Values.hostBridge.caPEM) }}
        checksum/host-bridge-ca: {{ (default .Values.hostBridge.caConfigMapName .Values.hostBridge.caPEM) | sha256sum | quote }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kuchdesk-agent.serviceAccountName" . }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kuchdesk-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: KUCHDESK_BASE_PROJECT_NAME
              value: {{ required "baseProject.name is required" .Values.baseProject.name | quote }}
            - name: KUCHDESK_BASE_PROJECT_ID
              value: {{ .Values.baseProject.id | quote }}
            - name: KUCHDESK_BASE_PROJECT_SLUG
              value: {{ .Values.baseProject.slug | quote }}
            - name: KUCHDESK_AGENT_LISTEN_ADDRESS
              value: {{ printf "%s:%v" .Values.agent.listenHost .Values.service.targetPort | quote }}
            - name: KUCHDESK_CLUSTER_ID
              value: {{ required "cluster.id is required" .Values.cluster.id | quote }}
            - name: KUCHDESK_CLUSTER_NAME
              value: {{ required "cluster.name is required" .Values.cluster.name | quote }}
            - name: KUCHDESK_CLUSTER_DOMAIN
              value: {{ required "cluster.domain is required" .Values.cluster.domain | quote }}
            - name: KUCHDESK_METRICS_INTERVAL
              value: {{ .Values.agent.metricsInterval | quote }}
            - name: KUCHDESK_REFRESH_DEBOUNCE
              value: {{ .Values.agent.refreshDebounce | quote }}
            - name: KUCHDESK_SSE_HEARTBEAT
              value: {{ .Values.agent.sseHeartbeat | quote }}
            - name: KUCHDESK_SSE_HISTORY
              value: {{ .Values.agent.sseHistory | quote }}
            - name: KUCHDESK_EVENT_LIMIT
              value: {{ .Values.agent.eventLimit | quote }}
            - name: KUCHDESK_DNS_MANAGEMENT_ENABLED
              value: {{ .Values.dnsManagement.enabled | quote }}
            - name: KUCHDESK_MANAGEMENT_ENABLED
              value: {{ .Values.agent.managementEnabled | quote }}
            - name: KUCHDESK_EXEC_ENABLED
              value: {{ .Values.agent.execEnabled | quote }}
            - name: KUCHDESK_PORT_FORWARD_ENABLED
              value: {{ .Values.agent.portForwardEnabled | quote }}
            - name: KUCHDESK_HOST_BRIDGE_ENABLED
              value: {{ .Values.hostBridge.enabled | quote }}
            {{- if .Values.hostBridge.enabled }}
            - name: KUCHDESK_HOST_BRIDGE_URL
              value: {{ .Values.hostBridge.url | quote }}
            - name: KUCHDESK_HOST_BRIDGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-bridge-auth" (include "kuchdesk-agent.fullname" . | trunc 51 | trimSuffix "-")) .Values.hostBridge.tokenSecretName | quote }}
                  key: {{ .Values.hostBridge.tokenKey | quote }}
            {{- if or .Values.hostBridge.caConfigMapName .Values.hostBridge.caPEM }}
            - name: KUCHDESK_HOST_BRIDGE_CA_FILE
              value: /etc/kuchdesk/host-bridge/ca.crt
            {{- end }}
            {{- end }}
            - name: KUCHDESK_COREDNS_NAMESPACE
              value: {{ required "dnsManagement.namespace is required" .Values.dnsManagement.namespace | quote }}
            - name: KUCHDESK_COREDNS_CONFIGMAP
              value: {{ required "dnsManagement.configMapName is required" .Values.dnsManagement.configMapName | quote }}
            - name: KUCHDESK_COREDNS_COREFILE_KEY
              value: {{ required "dnsManagement.corefileKey is required" .Values.dnsManagement.corefileKey | quote }}
            {{- if or .Values.auth.existingSecret .Values.auth.token }}
            - name: KUCHDESK_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-auth" (include "kuchdesk-agent.fullname" .)) .Values.auth.existingSecret | quote }}
                  key: {{ $.Values.auth.tokenKey | quote }}
            {{- end }}
          {{- if and .Values.hostBridge.enabled (or .Values.hostBridge.caConfigMapName .Values.hostBridge.caPEM) }}
          volumeMounts:
            - name: host-bridge-ca
              mountPath: /etc/kuchdesk/host-bridge
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if and .Values.hostBridge.enabled (or .Values.hostBridge.caConfigMapName .Values.hostBridge.caPEM) }}
      volumes:
        - name: host-bridge-ca
          configMap:
            name: {{ default (printf "%s-bridge-ca" (include "kuchdesk-agent.fullname" . | trunc 53 | trimSuffix "-")) .Values.hostBridge.caConfigMapName | quote }}
            items:
              - key: {{ .Values.hostBridge.caKey | quote }}
                path: ca.crt
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
