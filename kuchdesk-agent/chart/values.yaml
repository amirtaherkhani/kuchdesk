baseProject:
  name: Kubedesk Platform
  id: ""
  slug: ""

replicaCount: 1

image:
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

cluster:
  id: ""
  name: ""
  domain: cluster.local

agent:
  # The HTTP port follows service.targetPort; leave empty to listen on all interfaces.
  listenHost: ""
  managementEnabled: false
  execEnabled: false
  portForwardEnabled: false
  metricsInterval: 10s
  refreshDebounce: 250ms
  sseHeartbeat: 15s
  sseHistory: 256
  eventLimit: 100

auth:
  existingSecret: kuchdesk-agent-auth
  token: ""
  tokenKey: KUCHDESK_AGENT_TOKEN

hostBridge:
  enabled: false
  url: ""
  token: "" # Private local YAML only; creates a dedicated Kubernetes Secret.
  tokenSecretName: ""
  tokenKey: KUCHDESK_HOST_BRIDGE_TOKEN
  caPEM: "" # Public trust certificate; creates a dedicated ConfigMap.
  caConfigMapName: ""
  caKey: ca.crt

dnsManagement:
  enabled: false
  namespace: kube-system
  configMapName: coredns
  corefileKey: Corefile

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true
  # Grants this agent ServiceAccount every Kubernetes API permission.
  # Enable only for a cluster where KuchDesk administrators are trusted.
  clusterAdmin: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

readinessProbe:
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 6

livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 20
  timeoutSeconds: 2
  failureThreshold: 3

terminationGracePeriodSeconds: 20

networkPolicy:
  enabled: false
  ingressNamespaceSelector: {}
  ingressPodSelector: {}

nodeSelector: {}
tolerations: []
affinity: {}
