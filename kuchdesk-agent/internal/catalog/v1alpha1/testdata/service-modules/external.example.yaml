# Illustrative registration only. No deployment/chart is owned by this module.
apiVersion: catalog.kuchdesk.io/v1alpha1
kind: ServiceModule
module:
  id: external-example-app
  displayName: External Example App
  category: external
  ownership: external
  purpose: Demonstrates observation metadata for an externally owned application.
components:
  - id: external-example-api
    type: microservice
    purpose: Demonstrates an observed external API component.
    provides:
      - example.api
    requires: []
    externalConnections: []
    workloadRefs:
      - apiVersion: apps/v1
        kind: Deployment
        name: external-example-api
        namespace: example-external
    endpoints:
      - name: https
        protocol: https
        addressRef: ingress:example-external/external-example-api
    healthChecks: []
    observability:
      dashboards: []
      metrics: []
      logs: []
