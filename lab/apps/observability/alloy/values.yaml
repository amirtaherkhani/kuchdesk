controller:
  type: daemonset

configReloader:
  enabled: false

serviceMonitor:
  enabled: true
  additionalLabels:
    release: monitoring
  interval: 30s

alloy:
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
      appProtocol: h2c
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP

  configMap:
    content: |
      logging {
        level = "info"
      }

      // OTLP is a local development ingress; its LoadBalancer Service applies source ranges.
      otelcol.receiver.otlp "signals" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }

        http {
          endpoint = "0.0.0.0:4318"
        }

        output {
          traces  = [otelcol.processor.batch.traces.input]
          metrics = [otelcol.processor.transform.otlp_metrics.input]
          logs    = [otelcol.processor.attributes.otlp_logs.input]
        }
      }

      otelcol.processor.transform "otlp_metrics" {
        error_mode = "ignore"

        metric_statements {
          context = "datapoint"
          statements = [
            `set(attributes["service_name"], resource.attributes["service.name"])`,
            `set(attributes["service_namespace"], resource.attributes["service.namespace"])`,
            `set(attributes["deployment_environment"], resource.attributes["deployment.environment"])`,
            `set(attributes["client_mode"], resource.attributes["client.mode"])`,
          ]
        }

        output {
          metrics = [otelcol.processor.batch.metrics.input]
        }
      }

      otelcol.processor.attributes "otlp_logs" {
        action {
          key    = "loki.resource.labels"
          action = "insert"
          value  = "service.name, service.namespace, deployment.environment, client.mode"
        }

        output {
          logs = [otelcol.processor.batch.otlp_logs.input]
        }
      }

      otelcol.processor.batch "metrics" {
        output {
          metrics = [otelcol.exporter.prometheus.otlp.input]
        }
      }

      otelcol.exporter.prometheus "otlp" {
        forward_to = [prometheus.remote_write.otlp.receiver]
      }

      prometheus.remote_write "otlp" {
        endpoint {
          url = "http://monitoring-kube-prometheus-prometheus.observability.svc.cluster.local:9090/api/v1/write"
        }
      }

      otelcol.processor.batch "otlp_logs" {
        output {
          logs = [otelcol.exporter.loki.otlp.input]
        }
      }

      otelcol.exporter.loki "otlp" {
        forward_to = [loki.write.local.receiver]
      }

      otelcol.processor.batch "traces" {
        timeout         = "1s"
        send_batch_size = 1024

        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo:4317"

          tls {
            insecure             = true
            insecure_skip_verify = true
          }
        }
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {

        stage.static_labels {
          values = {
            cluster = "local",
          }
        }

        // Parse application NDJSON once at ingestion. Only bounded,
        // low-cardinality dimensions become indexed Loki labels.
        stage.json {
          expressions = {
            level                  = "level",
            service_name           = "service_name",
            service_version        = "service_version",
            deployment_environment = "deployment_environment",
            component              = "component",
            outcome                = "outcome",
            event_name             = "event_name",
            operation              = "operation",
            logger                 = "logger",
            request_id             = "request_id",
            correlation_id         = "correlation_id",
            causation_id           = "causation_id",
            trace_id               = "trace_id",
            span_id                = "span_id",
            event_id               = "event_id",
            job_id                 = "job_id",
            workflow_execution_id  = "workflow_execution_id",
            http_method            = "http_method",
            http_route             = "http_route",
            http_status_code       = "http_status_code",
            provider               = "provider",
            queue                  = "queue",
            websocket_event        = "websocket_event",
          }
        }

        stage.labels {
          values = {
            level                  = "",
            service_name           = "",
            service_version        = "",
            deployment_environment = "",
            component              = "",
            outcome                = "",
          }
        }

        // Searchable correlation and domain fields stay unindexed to avoid
        // creating one Loki stream per request, trace, event, job, or workflow.
        stage.structured_metadata {
          values = {
            event_name            = "",
            operation             = "",
            logger                = "",
            request_id            = "",
            correlation_id        = "",
            causation_id          = "",
            trace_id              = "",
            span_id               = "",
            event_id              = "",
            job_id                = "",
            workflow_execution_id = "",
            http_method           = "",
            http_route            = "",
            http_status_code      = "",
            provider              = "",
            queue                 = "",
            websocket_event       = "",
          }
        }

        forward_to = [loki.write.local.receiver]
      }

      loki.write "local" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }

      // Only server-level Redis telemetry: no key patterns, values, scans, or scripts.
      prometheus.exporter.redis "finance_server" {
        redis_addr = "redis://redis.platform-storage.svc.cluster.local:6379"
        redis_user = sys.env("REDIS_METRICS_USER")
        redis_password = sys.env("REDIS_METRICS_PASSWORD")
        export_client_list = false
        export_client_port = false
        export_key_values = false
        set_client_name = false
        connection_timeout = "5s"
      }

      prometheus.scrape "redis_native" {
        targets = prometheus.exporter.redis.finance_server.targets
        job_name = "redis-native"
        scrape_interval = "30s"
        scrape_timeout = "10s"
        forward_to = [prometheus.remote_write.otlp.receiver]
      }

      // Scrape only the approved Finance database through its monitoring login.
      prometheus.exporter.postgres "finance_server" {
        data_source_names = [sys.env("POSTGRES_METRICS_URI")]
        autodiscovery { enabled = false }
      }

      prometheus.scrape "postgresql_native" {
        targets = prometheus.exporter.postgres.finance_server.targets
        job_name = "postgresql-native"
        scrape_interval = "30s"
        scrape_timeout = "15s"
        forward_to = [prometheus.remote_write.otlp.receiver]
      }
  extraEnv:
    - name: REDIS_METRICS_USER
      valueFrom:
        secretKeyRef:
          name: redis-metrics-auth
          key: username
    - name: REDIS_METRICS_PASSWORD
      valueFrom:
        secretKeyRef:
          name: redis-metrics-auth
          key: password
    - name: POSTGRES_METRICS_URI
      valueFrom:
        secretKeyRef:
          name: postgresql-metrics-auth
          key: uri
