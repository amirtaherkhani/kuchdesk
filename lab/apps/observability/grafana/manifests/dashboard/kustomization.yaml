apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard
    grafana_dashboard: "1"
  annotations:
    # Absolute sidecar path avoids Platform/Platform under the default folder.
    grafana_folder: /tmp/dashboards/Platform

configMapGenerator:
  - name: platform-observability-dashboard
    files:
      - platform-observability-dashboard.json
  - name: host-dns-dashboard
    files:
      - host-dns-dashboard.json
