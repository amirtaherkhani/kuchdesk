{{- $authMethod := default "universalAuth" .Values.infisical.authMethod -}}
{{- if not (has $authMethod (list "universalAuth" "kubernetesAuth")) -}}
{{- fail "infisical.authMethod must be universalAuth or kubernetesAuth" -}}
{{- end -}}
{{- if eq $authMethod "kubernetesAuth" -}}
{{- $k8 := default dict .Values.infisical.kubernetesAuth -}}
{{- $sa := default dict $k8.serviceAccountRef -}}
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-identity-reference
  namespace: {{ include "grafana.namespace" . }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
type: Opaque
stringData:
  # This existing identity UUID is an identifier, not an authentication secret.
  identityId: {{ required "infisical.kubernetesAuth.identityId is required" $k8.identityId | quote }}
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalConnection
metadata:
  name: grafana-admin
  namespace: {{ include "grafana.namespace" . }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
spec:
  address: {{ required "infisical.hostAPI is required" .Values.infisical.hostAPI | quote }}
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalAuth
metadata:
  name: grafana-admin
  namespace: {{ include "grafana.namespace" . }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
spec:
  infisicalConnectionRef:
    name: grafana-admin
    namespace: {{ include "grafana.namespace" . }}
  method: kubernetes
  kubernetes:
    identityIdRef:
      name: grafana-admin-identity-reference
      namespace: {{ include "grafana.namespace" . }}
      key: identityId
    serviceAccountRef:
      name: {{ required "infisical.kubernetesAuth.serviceAccountRef.name is required" $sa.name | quote }}
      namespace: {{ required "infisical.kubernetesAuth.serviceAccountRef.namespace is required" $sa.namespace | quote }}
    serviceAccountTokenAudiences: {{ $k8.serviceAccountTokenAudiences | default (list) | toJson }}
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: grafana-admin
  namespace: {{ include "grafana.namespace" . }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
    home-lab/managed-by: infisical
spec:
  infisicalAuthRef:
    name: grafana-admin
    namespace: {{ include "grafana.namespace" . }}
  syncOptions:
    refreshInterval: 1m
    instantUpdates: false
  sources:
    - projectSlug: {{ required "infisical.projectSlug is required" .Values.infisical.projectSlug | quote }}
      environmentSlug: {{ required "infisical.envSlug is required" .Values.infisical.envSlug | quote }}
      secretPath: {{ required "infisical.secretsPath is required" .Values.infisical.secretsPath | quote }}
      recursive: false
  targets:
    - name: grafana-admin
      namespace: {{ include "grafana.namespace" . }}
      kind: Secret
      secretType: Opaque
      # Preserve this credential Secret when its synchronization CR is removed.
      creationPolicy: Orphan
      # No template includes every source key, matching includeAllSecrets: true.
{{- else }}
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: grafana-admin
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
    home-lab/managed-by: infisical
spec:
  hostAPI: {{ required "infisical.hostAPI is required" .Values.infisical.hostAPI | quote }}
  syncConfig:
    resyncInterval: 1m
    instantUpdates: false
  authentication:
    universalAuth:
      credentialsRef:
        secretName: {{ required "infisical.credentialsSecretName is required" .Values.infisical.credentialsSecretName | quote }}
        secretNamespace: {{ required "infisical.credentialsSecretNamespace is required" .Values.infisical.credentialsSecretNamespace | quote }}
      secretsScope:
        projectSlug: {{ required "infisical.projectSlug is required" .Values.infisical.projectSlug | quote }}
        envSlug: {{ required "infisical.envSlug is required" .Values.infisical.envSlug | quote }}
        secretsPath: {{ required "infisical.secretsPath is required" .Values.infisical.secretsPath | quote }}
  managedSecretReference:
    secretName: grafana-admin
    secretNamespace: {{ include "grafana.namespace" . }}
    creationPolicy: Owner
    template:
      includeAllSecrets: true
{{- end }}
