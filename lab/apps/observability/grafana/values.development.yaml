# Shared approved development behavior; supply site and admin values directly.
# Use only on deployments intended to permit anonymous development editing.
grafana.ini:
  auth.anonymous:
    enabled: true
    org_name: Main Org.
    org_role: Editor
  users:
    viewers_can_edit: false

sidecar:
  dashboards:
    enabled: true
    resource: configmap
    label: grafana_dashboard
    labelValue: "1"
    defaultFolderName: Platform
    folderAnnotation: grafana_folder
    skipReload: true
    initDashboards: true
    restartPolicy: Always
    startupProbe:
      httpGet:
        path: /healthz
        port: 8084
      periodSeconds: 2
      timeoutSeconds: 1
      failureThreshold: 60
    provider:
      allowUiUpdates: false
      foldersFromFilesStructure: true
      updateIntervalSeconds: 30
