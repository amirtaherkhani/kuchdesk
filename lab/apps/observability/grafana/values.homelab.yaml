replicas: 1
image:
  registry: docker.io
  repository: grafana/grafana-enterprise
  tag: "13.1.0"
  pullPolicy: IfNotPresent
# Set adminUser/adminPassword only in the ignored values.local.yaml overlay.
# The chart creates its own Secret directly from those values.

# The PVC is ReadWriteOnce, so replacement pods must not overlap.
deploymentStrategy:
  type: Recreate
revisionHistoryLimit: 3
enableServiceLinks: false
testFramework:
  enabled: false
service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 3000
# Enable the renderer used by Grafana panel/image export and k6 evidence.
# Keep the image version pinned so renderer behavior is reproducible.
imageRenderer:
  enabled: true
  replicas: 1
  image:
    tag: v5.12.2
    pullPolicy: IfNotPresent
  serviceMonitor:
    enabled: true
    labels:
      release: monitoring
  networkPolicy:
    limitIngress: true
    extraIngressSelectors:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: observability
        podSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus
serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s
  labels:
    release: monitoring
ingress:
  enabled: true
  ingressClassName: traefik
  path: /
  pathType: Prefix
  hosts: [grafana.local.dev]
  tls:
    - secretName: kubedesk-local-tls
      hosts: [grafana.local.dev]
persistence:
  enabled: true
  type: pvc
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  finalizers:
    - kubernetes.io/pvc-protection
initChownData:
  enabled: true
  # Use the same pinned image as the main Grafana workload.
  image:
    registry: docker.io
    repository: grafana/grafana-enterprise
    tag: 13.1.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
grafana.ini:
  paths:
    data: /var/lib/grafana/
    logs: /var/log/grafana
    plugins: /var/lib/grafana/plugins
    provisioning: /etc/grafana/provisioning
  analytics:
    reporting_enabled: false
    check_for_updates: false
    check_for_plugin_updates: false
  log:
    mode: console
  server:
    domain: grafana.local.dev
    root_url: https://grafana.local.dev
  security:
    cookie_secure: true
    cookie_samesite: lax
    allow_embedding: false
    disable_gravatar: true
  users:
    default_theme: dark
    viewers_can_edit: false
  auth.anonymous:
    # Fresh local ingress requires authentication.
    enabled: false
    org_name: Main Org.
    org_role: Editor
  unified_alerting:
    enabled: true
  plugins:
    # Avoid offline update noise for the explicitly installed plugin.
    preinstall_disabled: true
    preinstall_auto_update: false
  live:
    max_connections: 100
datasources:
  datasources.yaml:
    apiVersion: 1
    prune: true
    deleteDatasources:
      - name: Prometheus
        orgId: 1
      - name: Loki
        orgId: 1
      - name: Tempo
        orgId: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://monitoring-kube-prometheus-prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          prometheusType: Prometheus
          prometheusVersion: 3.13.1
          timeInterval: 30s
          exemplarTraceIdDestinations:
            - datasourceUid: tempo
              name: traceID
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        editable: false
        jsonData:
          derivedFields:
            - name: traceId
              matcherRegex: '(?:trace_id|traceId|traceID|traceid)[=:\" ]+([0-9a-fA-F]{16,32})'
              datasourceUid: tempo
              url: '$${__value.raw}'
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        editable: false
        jsonData:
          nodeGraph:
            enabled: true
          serviceMap:
            datasourceUid: prometheus
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: true
            filterBySpanID: true
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            tags:
              - key: service.name
                value: service_name
              - key: k8s.namespace.name
                value: namespace
              - key: k8s.pod.name
                value: pod
sidecar:
  image:
    registry: docker.io
    repository: kiwigrid/k8s-sidecar
    tag: "2.8.1"
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      # Avoid CFS throttling while dashboard discovery scans all namespaces.
      memory: 256Mi
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: ALL
    resource: configmap
    # File provisioning creates/reuses Platform and routes unannotated files
    # there automatically. Explicit grafana_folder annotations still win.
    defaultFolderName: Platform
    folderAnnotation: grafana_folder
    # Collect files before startup; later updates use Grafana's file poll.
    # No admin API reload call or sidecar bootstrap credentials are needed.
    skipReload: true
    initDashboards: true
    restartPolicy: Always
    startupProbe:
      httpGet:
        path: /healthz
        port: 8084
      periodSeconds: 2
      timeoutSeconds: 1
      failureThreshold: 60
    provider:
      name: sidecarProvider
      orgid: 1
      type: file
      disableDelete: false
      allowUiUpdates: false
      foldersFromFilesStructure: true
      updateIntervalSeconds: 30
