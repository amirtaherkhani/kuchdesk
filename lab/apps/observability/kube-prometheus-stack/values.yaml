prometheus:
  prometheusSpec:
    image:
      registry: docker.io
      repository: prom/prometheus
      tag: "v3.13.1"
    retention: 3d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
    # Required for k6's experimental-prometheus-rw output.
    enableRemoteWriteReceiver: true

# The local K3s control-plane components are not exposed as stable
# scrape Services.
kubeControllerManager:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false

kubeScheduler:
  enabled: false

defaultRules:
  disabled:
    # These local control-plane components are intentionally not scraped.
    KubeControllerManagerDown: true
    KubeEtcdDown: true
    KubeProxyDown: true
    KubeSchedulerDown: true
    # The Colima VM does not provide a configured NTP scrape endpoint.
    NodeClockNotSynchronising: true

grafana:
  enabled: false
  # Keep kube-prometheus-stack dashboard ConfigMaps for standalone Grafana.
  forceDeployDashboards: true

# Keep pinned image mirrors for reproducible local pulls.
kubeStateMetrics:
  enabled: true

kube-state-metrics:
  image:
    registry: docker.io
    repository: altinity/kube-state-metrics
    tag: "v2.19.1"

prometheus-node-exporter:
  image:
    registry: ghcr.io
    repository: prometheus/node-exporter
    tag: "v1.12.0"
    distroless: true

prometheusOperator:
  image:
    registry: ghcr.io
    repository: prometheus-operator/prometheus-operator
    tag: "v0.92.1"
  prometheusConfigReloader:
    image:
      registry: ghcr.io
      repository: prometheus-operator/prometheus-config-reloader
      tag: "v0.92.1"
  prometheusDefaultBaseImage: prom/prometheus
  prometheusDefaultBaseImageRegistry: docker.io
  alertmanagerDefaultBaseImage: prom/alertmanager
  alertmanagerDefaultBaseImageRegistry: docker.io

alertmanager:
  alertmanagerSpec:
    retention: 72h
    image:
      registry: docker.io
      repository: prom/alertmanager
      tag: "v0.33.1"
