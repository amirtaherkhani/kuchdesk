deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 72h

  compactor:
    retention_enabled: true
    delete_request_store: filesystem

  # The rules sidecar and Loki mount the same volume at /rules.
  # Without this, Loki's default /var/loki/rules does not read delivered files.
  rulerConfig:
    storage:
      type: local
      local:
        directory: /rules

# Preserve the approved upstream sidecar version on routine deployments.
sidecar:
  image:
    registry: docker.io
    repository: kiwigrid/k8s-sidecar
    tag: "2.8.1"
    sha: abb55b2165c60e8f97e473862c7a3123df6f67d44f592949577c29b8fb2df9d6

singleBinary:
  replicas: 1

  persistence:
    enabled: true
    size: 10Gi
    whenDeleted: Retain
    whenScaled: Retain

# Disable Simple Scalable mode
backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

# Disable unnecessary components for local development

gateway:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

lokiCanary:
  enabled: false

test:
  enabled: false
