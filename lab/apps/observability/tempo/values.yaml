deploymentMode: SingleBinary

tempo:
  reportingEnabled: false
  # Automatically remove local trace blocks older than three days. The
  # single-binary deployment runs the compaction/retention loop in-process.
  retention: 72h

  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://monitoring-kube-prometheus-prometheus:9090/api/v1/write
    processor:
      service_graphs:
        wait: 10s
        max_items: 10000
      span_metrics:
        enable_target_info: true
    storage:
      path: /var/tempo/metrics
    traces_storage:
      path: /var/tempo/generator-wal

  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics

  storage:
    trace:
      backend: local
      local:
        # Keep persisted trace blocks separate from Tempo's WAL directory.
        path: /var/tempo/traces

persistence:
  enabled: true
  size: 10Gi

singleBinary:
  replicas: 1

# Disable distributed components
distributor:
  replicas: 0

ingester:
  replicas: 0

querier:
  replicas: 0

queryFrontend:
  replicas: 0

compactor:
  replicas: 0

gateway:
  enabled: false
serviceMonitor:
  enabled: true
  additionalLabels:
    release: monitoring
  interval: 30s
  scrapeTimeout: 10s
