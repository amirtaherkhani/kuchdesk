apiVersion: v1
kind: Service
metadata:
  name: finance-maildev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: finance-maildev
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: smtp
      port: {{ .Values.smtpPort }}
      targetPort: smtp
    - name: web
      port: {{ .Values.webPort }}
      targetPort: web
