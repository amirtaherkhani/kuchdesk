apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports: [{name: redis, protocol: TCP, port: 6379, targetPort: 6379}]
---
{{- if .Values.publication.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: redis-public
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports: [{name: redis, protocol: TCP, port: {{ .Values.publication.port }}, targetPort: 6379}]
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{protocol: TCP, port: 6379}]
  egress: []
