apiVersion: v1
kind: Service
metadata:
  name: technitium
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: technitium
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: dns-udp
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: dns-tcp
    - name: admin
      port: 5380
      protocol: TCP
      targetPort: admin
{{- if .Values.lanService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: technitium-lan
spec:
  type: {{ .Values.lanService.type }}
  selector:
    app.kubernetes.io/name: technitium
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: dns-udp
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: dns-tcp
{{- end }}
