# Apply these settings to a new, dedicated Colima profile during the later deployment step.
runtime: containerd
portForwarder: grpc # Required for UDP; the active SSH forwarder supports TCP only.
provision:
  - mode: after-boot
    script: |
      printf 'fs.inotify.max_user_instances = 1024\n' > /etc/sysctl.d/99-kuchdesk-inotify.conf
      sysctl -p /etc/sysctl.d/99-kuchdesk-inotify.conf
kubernetes:
  enabled: true
  version: v1.35.0+k3s1
  k3sArgs: [] # Colima's default disables Traefik; the fresh profile needs K3s Traefik.
network:
  address: true
  dns:
    - 1.1.1.1
    - 8.8.8.8
mounts:
  - location: /ABSOLUTE/PATH/TO/KUCHDESK
    writable: false
autoActivate: false
