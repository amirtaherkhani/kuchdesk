apiVersion: v1
kind: Service
metadata:
  name: traefik-lan
  namespace: platform-networking
  labels:
    app.kubernetes.io/name: traefik-lan
    app.kubernetes.io/part-of: kuchdesk-platform
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/instance: traefik-platform-system
    app.kubernetes.io/name: traefik
  ports:
    - name: web
      nodePort: 32366
      port: 80
      protocol: TCP
      targetPort: web
    - name: websecure
      nodePort: 32013
      port: 443
      protocol: TCP
      targetPort: websecure
