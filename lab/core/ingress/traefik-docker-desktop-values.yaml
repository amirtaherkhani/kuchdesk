# Historical offline render fixture; fresh K3s uses traefik-k3s.yaml.
# Docker Desktop's Traefik release was managed directly by Helm. Watch all
# namespaces so newly enabled KuchDesk modules do not need controller edits.
deployment:
  kind: Deployment
  replicas: 1
api:
  dashboard: false
ingressClass:
  enabled: true
  isDefaultClass: false
ports:
  traefik:
    expose:
      default: false
  web:
    expose:
      default: true
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    expose:
      default: true
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: false
    namespaces: []
  kubernetesIngress:
    enabled: true
    disableIngressClassLookup: false
    namespaces: []
    publishedService:
      enabled: false
rbac:
  enabled: true
  namespaced: false
service:
  enabled: true
  type: ClusterIP
