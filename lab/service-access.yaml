version: 1
publicationRanges:
  TCP:
    - 20000
    - 20099
  UDP:
    - 20000
    - 20099
# Non-Kubernetes publications reserve ports here without inventing a Service or
# Helm owner. They use the same native Lima forwarding range.
reservations:
  finance-container:
    owner: finance-container-development/app
    profile: kuchdesk-fresh
    namespace: default
    protocol: TCP
    publishedPort: 20008
    hostIP: 127.0.0.1
    backendPort: 3000
services:
  nats:
    id: nats
    enabled: true
    applyReady: true
    owner: platform-storage/nats
    namespace: platform-storage
    backendService: nats
    backendPort: 4222
    publishedService: nats-public
    publishedPort: 20000
    protocol: TCP
    verificationStatus: runtime-verified
    uiDomain: ""
    uiPort: 0
    uiEnabled: false
    modes:
      - pod
      - mac
      - container
  maildev-smtp:
    id: maildev-smtp
    enabled: true
    applyReady: true
    owner: vero/maildev
    namespace: vero
    backendService: finance-maildev
    backendPort: 1025
    publishedService: finance-maildev-smtp
    publishedPort: 20001
    protocol: TCP
    verificationStatus: runtime-verified
    uiDomain: maildev.local.dev
    uiPort: 1080
    uiEnabled: true
    modes:
      - pod
      - mac
      - container
      - web
  maildev-api:
    id: maildev-api
    enabled: true
    applyReady: false
    owner: kube-system/kuchdesk-ui
    namespace: kube-system
    backendService: kuchdesk-maildev-api
    backendPort: 20002
    publishedService: kuchdesk-maildev-api
    publishedPort: 20002
    protocol: TCP
    verificationStatus: runtime-verified
    uiDomain: maildev.local.dev
    uiPort: 1080
    uiEnabled: false
    modes:
      - pod
      - mac
      - container
  grafana:
    id: grafana
    enabled: true
    applyReady: false
    owner: observability/grafana
    namespace: observability
    backendService: grafana
    backendPort: 80
    publishedService: ""
    publishedPort: 0
    protocol: TCP
    verificationStatus: runtime-verified
    uiDomain: grafana.local.dev
    uiPort: 80
    uiEnabled: true
    modes:
      - pod
      - web
  technitium:
    id: technitium
    enabled: true
    applyReady: false
    owner: technitium/technitium
    namespace: technitium
    backendService: technitium
    backendPort: 5380
    publishedService: ""
    publishedPort: 0
    protocol: TCP
    verificationStatus: runtime-verified
    uiDomain: technitium.local.dev
    uiPort: 5380
    uiEnabled: true
    modes:
      - pod
      - web
  prometheus:
    id: prometheus
    enabled: true
    applyReady: false
    owner: observability/monitoring
    namespace: observability
    backendService: monitoring-kube-prometheus-prometheus
    backendPort: 9090
    publishedService: ""
    publishedPort: 0
    protocol: TCP
    verificationStatus: runtime-verified
    uiDomain: prometheus.local.dev
    uiPort: 9090
    uiEnabled: true
    modes:
